name: Build Android AAB & APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package Android AppBundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17 (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Display Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Verify static analysis
        run: flutter analyze

      - name: Run automated test suite
        run: flutter test

      - name: Inject Google Services JSON (if secret provided)
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > android/app/google-services.json
            echo "Injected google-services.json from repository secret."
          else
            echo "Using committed google-services.json."
          fi

      - name: Inject Android Keystore & Signing Config (if secrets provided)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks
            echo "Injected upload-keystore.jks from repository secret."
          fi
          cat << 'EOF' > android/key.properties
          storePassword=sumireach_keystore_pass123
          keyPassword=sumireach_keystore_pass123
          keyAlias=upload
          storeFile=../upload-keystore.jks
          EOF

      - name: Build Android App Bundle (AAB)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then
            flutter build appbundle --release --android-skip-build-dependency-validation --build-number=${{ github.run_number }} --dart-define=GEMINI_API_KEY=$GEMINI_API_KEY
          else
            flutter build appbundle --release --android-skip-build-dependency-validation --build-number=${{ github.run_number }}
          fi

      - name: Build Android APK
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then
            flutter build apk --release --android-skip-build-dependency-validation --build-number=${{ github.run_number }} --dart-define=GEMINI_API_KEY=$GEMINI_API_KEY
          else
            flutter build apk --release --android-skip-build-dependency-validation --build-number=${{ github.run_number }}
          fi

      - name: Upload Android App Bundle (AAB) Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sumireach-release-aab
          path: build/app/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sumireach-release-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30

      - name: Create GitHub Release (on version tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/bundle/release/*.aab
            build/app/outputs/flutter-apk/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}